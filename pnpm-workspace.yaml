packages:
  - "web"
  - "cli"
  - "packages/*"
# Native build scripts we trust and need: esbuild (tsup/tsx), sharp (Next image opt).
allowBuilds:
  esbuild: true
  sharp: true
# Force the transitive postcss (pulled by next/tsup) past the </style> XSS advisory (GHSA, <8.5.10).
overrides:
  postcss@<8.5.10: "8.5.16"
